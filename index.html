<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>castro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap">
<style>
/* Layout: web en columna única; portada con contenido gratuito (vídeos + entreno), vías de servicio y cuestionario opcional por pasos */
:root{
  --bg:#FFFFFF; --surface:#F5F2E8; --surface-2:#EDE9DC; --ink:#3A3933; --muted:#78766A; --line:#DCD7C7;
  --accent:#DDB1AC; --accent-ink:#A5625E; --accent-soft:#F7E8E5; --on-accent:#3A3933; --deep:#E8C6C1; --on-deep:#3A3933;
  --wall:#EDE6DA; --floor:#C9B5A2; --veil:rgba(245,242,232,.86); --rose:#A5625E; --blob1:#F1DCD8; --blob2:#E8D8C8;
  --warn-bg:#F3EAD8; --warn-ink:#6E5532; --warn-line:#D9C39C; --ok:#5E7A5A;
  --font-display:"Outfit","Helvetica Neue",Arial,sans-serif;
  --font-body:"Outfit","Helvetica Neue",Arial,sans-serif;
  --radius:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1D19; --surface:#26281F; --surface-2:#2E3027; --ink:#ECEADF; --muted:#A5A393; --line:#3A3C31;
  --accent:#D9A8A3; --accent-ink:#EBC0BB; --accent-soft:#3B2E2C; --on-accent:#1C1D19; --deep:#4A3634; --on-deep:#ECEADF;
  --wall:#38342D; --floor:#5A4B3E; --veil:rgba(28,29,25,.84); --rose:#EBC0BB; --blob1:#4A3734; --blob2:#4A3D33;
  --warn-bg:#352D20; --warn-ink:#E9D3A8; --warn-line:#6A5634; --ok:#9DBB98; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1D19; --surface:#26281F; --surface-2:#2E3027; --ink:#ECEADF; --muted:#A5A393; --line:#3A3C31;
  --accent:#D9A8A3; --accent-ink:#EBC0BB; --accent-soft:#3B2E2C; --on-accent:#1C1D19; --deep:#4A3634; --on-deep:#ECEADF;
  --wall:#38342D; --floor:#5A4B3E; --veil:rgba(28,29,25,.84); --rose:#EBC0BB; --blob1:#4A3734; --blob2:#4A3D33;
  --warn-bg:#352D20; --warn-ink:#E9D3A8; --warn-line:#6A5634; --ok:#9DBB98; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-inline:16px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:6px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.brand b{font-family:var(--font-display);font-size:1.45rem;font-weight:700;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.brand b span{color:var(--accent-ink)}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
.count{font-family:var(--font-display);font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);min-height:48px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}

.pend{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--warn-ink);background:var(--warn-bg);border:1px dashed var(--warn-line);border-radius:99px;padding:1px 8px}
.ph{color:var(--muted);font-style:italic}

/* Portada */
.home{display:grid;gap:48px;padding-bottom:48px}
.hero{padding-block:28px 0;display:grid;gap:16px}
.hero h1{font-size:clamp(2.6rem,9vw,4.2rem);text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--accent-ink)}
.hero p{color:var(--muted);max-width:52ch;font-size:1.05rem}
.sec{display:grid;gap:16px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-t{font-size:1.9rem;text-transform:uppercase}
.sec-sub{color:var(--muted);max-width:56ch}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);font-weight:600;margin-bottom:6px}
.free{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--ok)}

.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.video{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:grid;text-align:left;padding:0;cursor:pointer}
.thumb{aspect-ratio:16/9;max-width:100%;background:repeating-linear-gradient(135deg,var(--surface-2) 0 12px,var(--bg) 12px 24px);display:grid;place-items:center;position:relative;border-bottom:1px dashed var(--line)}
.play{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.play::after{content:"";border-left:16px solid var(--on-accent);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.dur{position:absolute;right:8px;bottom:8px;font-size:.75rem;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:4px;padding:1px 6px;color:var(--muted)}
.video .vb{padding:12px 14px;display:grid;gap:4px}
.video .vb b{font-weight:600}
.video .vb span{font-size:.85rem;color:var(--muted)}

.feature{background:var(--deep);color:var(--on-deep);border-radius:16px;padding:24px;display:grid;gap:14px}
.feature .free{color:var(--on-deep);opacity:.8}
.feature h3{font-size:clamp(1.9rem,6vw,2.6rem);text-transform:uppercase}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem}
.facts span b{font-weight:600}
.feature .btn{background:var(--on-deep);color:var(--deep);justify-self:start}

.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:10px;align-content:start}
.path h3{font-size:1.6rem;text-transform:uppercase}
.path p{color:var(--muted);font-size:.95rem}
.prog-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prog-list li{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:2px}
.prog-list b{font-weight:600}
.prog-list span{font-size:.88rem;color:var(--muted)}

.cta{border:1.5px solid var(--accent);border-radius:16px;padding:22px;display:grid;gap:12px;background:var(--accent-soft)}
.cta h2{font-size:1.9rem;text-transform:uppercase}
.cta p{color:var(--muted)}
.cta .btn{justify-self:start}
.foot{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

/* Entreno gratis */
.page{display:grid;gap:24px;padding-block:8px 48px}
.page h1{font-size:clamp(2.4rem,8vw,3.4rem);text-transform:uppercase}
.back{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;cursor:pointer;justify-self:start}
.blocks{display:grid;gap:12px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.blk h3{font-size:1.35rem;text-transform:uppercase;margin-bottom:8px}
.ex{list-style:none;margin:0;padding:0;display:grid}
.ex li{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:.95rem;padding-block:8px;border-bottom:1px dashed var(--line)}
.ex li:last-child{border-bottom:0}
.ex li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Cuestionario */
.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-block:4px 22px}
.progress i{height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.step{display:grid;gap:26px;padding-bottom:28px}
.step h2{font-size:clamp(2rem,7vw,2.8rem)}
.step h2:focus{outline:none}
.intro{color:var(--muted);margin-top:8px;max-width:56ch}
.field{display:grid;gap:10px}
.field>label,.field .lbl{font-weight:600}
.help{color:var(--muted);font-size:.9rem;margin-top:-4px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.opts.big{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px;display:grid;gap:2px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--accent-soft)}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:.85rem;line-height:1.35}
.opts.big .opt{padding:16px}
.rango{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px}
.rango output{font-size:1rem;color:var(--muted)}
.rango output b{font-size:2.2rem;font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.rango input[type=range]{width:100%;accent-color:var(--accent);height:28px;cursor:pointer}
.ticks{position:relative;height:1.3em;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.opts.num{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.opts.num .opt{text-align:center;font-family:var(--font-display);font-size:1.5rem;font-weight:600;padding:8px}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;min-height:48px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:2px;padding:12px 14px;width:100%;resize:vertical;min-height:90px}
textarea:focus{border-color:var(--accent);outline:none}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;max-width:260px;width:100%}
input[type=date]:focus{border-color:var(--accent);outline:none}
input[type=text]:focus{border-color:var(--accent);outline:none}
.yn{display:grid;gap:8px}
.yn-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.yn-row p{font-size:.95rem;min-width:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;min-width:52px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.navbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:10px;margin-inline:-16px;padding-inline:16px}
.navbar .hint{align-self:center;color:var(--muted);font-size:.85rem;text-align:center;flex:1;min-width:0}

/* Resultado */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.banner{border-radius:var(--radius);padding:14px 16px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);font-size:.93rem}
.banner strong{display:block;margin-bottom:2px}
.reco{border:2px solid var(--accent);background:var(--surface);border-radius:16px;padding:20px;display:grid;gap:10px}
.reco h2{font-size:2rem;text-transform:uppercase}
.reco ul{margin:0;padding-left:1.1em;color:var(--muted)}
.badge{justify-self:start;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:2px 10px}
.prog-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:6px;align-content:start}
.pcard.top{border:2px solid var(--accent)}
.pcard b{font-family:var(--font-display);font-size:1.3rem}
.pcard span{font-size:.88rem;color:var(--muted)}

.nav{display:flex;gap:4px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.nav button{background:none;border:0;padding:4px 0;cursor:pointer;font-weight:500;color:var(--muted);font-size:.95rem}
.nav button:hover,.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.hero-grid>*{min-width:0}
.hero-video{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.hero-video .thumb{border-bottom:0}
.filters{display:grid;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .fl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:88px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);font-size:.95rem;padding:20px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}
.vtags{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.pack .cover{aspect-ratio:4/3;max-width:100%;background:var(--deep);color:var(--on-deep);display:grid;align-content:end;padding:14px}
.pack .cover b{font-family:var(--font-display);font-size:1.7rem;text-transform:uppercase;line-height:1}
.pack .pb{padding:14px;display:grid;gap:8px;align-content:start}
.pack .pb p{font-size:.9rem;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.78rem;color:var(--muted)}
.specs b{display:block;font-family:var(--font-display);font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.price{font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.about{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.about>*{min-width:0}
.photo{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px dashed var(--line);background:repeating-linear-gradient(135deg,var(--surface-2) 0 12px,var(--bg) 12px 24px);display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;padding:8px}
.about ul{margin:0;padding-left:1.1em;color:var(--muted);display:grid;gap:4px}

/* ---- Estética beige / aesthetic ---- */
body{font-weight:400;letter-spacing:.01em}
h1,h2,h3,.hero h1,.sec-t,.page h1,.cta h2,.path h3,.feature h3,.reco h2,.step h2,.pack .cover b,.blk h3,.pcard b{font-weight:300;text-transform:lowercase;letter-spacing:0;line-height:1.1}
.hero h1{font-size:clamp(2.2rem,6.5vw,3.3rem)}
h1,h2,h3,.hero h1,.sec-t,.page h1,.cta h2,.path h3,.feature h3,.reco h2,.step h2,.blk h3,.brand b,.pack .cover b,.pcard b{font-weight:300}
body{font-size:15px}
.hero h1 em{font-style:normal}
.sec-t{font-size:1.9rem}
.hero h1 em{color:var(--accent-ink)}
.sec-t{font-size:2rem}
.eyebrow,.free,.badge,.pend,.tag,.frow .fl{text-transform:lowercase;letter-spacing:.04em;font-weight:500}
.brand b{text-transform:lowercase;font-family:var(--font-display);font-weight:300;letter-spacing:.14em;font-size:1.25rem}
.brand b span{color:var(--accent-ink)}
.nav{justify-content:center;border-bottom:0;gap:4px 26px;padding-block:6px 14px}
.nav button{text-transform:lowercase;font-size:1.05rem;font-weight:400;letter-spacing:.02em}
.nav button[aria-current="page"]{box-shadow:none;color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.btn{border-radius:2px;text-transform:lowercase;font-weight:500;letter-spacing:.03em}
.feature,.cta,.reco,.about,.hero-video,.pack,.blk,.path,.pcard,.opt,.yn-row,.seg,input[type=text],.chip,.fchip,.banner,.empty,.photo{border-radius:2px}
.thumb{aspect-ratio:4/3;background:linear-gradient(180deg,var(--wall) 0 58%,var(--floor) 58% 100%);border-bottom:0}
.hero-video .thumb{aspect-ratio:16/10}
.play{width:46px;height:46px;background:var(--veil)}
.play::after{border-left-color:var(--ink);border-left-width:13px;border-top-width:8px;border-bottom-width:8px}
.hero-video .dur{background:var(--veil);color:var(--ink);border-radius:0;left:0;right:0;bottom:0;padding:10px 14px;text-transform:lowercase;font-size:.95rem}
.videos{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.video{position:relative;border:0;border-radius:0;background:transparent;display:block}
.video .vb{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;background:var(--veil);color:var(--ink)}
.video .vb b{font-weight:400;font-size:1rem;text-transform:lowercase;min-width:0}
.video .vb .t{font-variant-numeric:tabular-nums;white-space:nowrap}
.video .pend{position:absolute;top:10px;left:10px}
.fchip{text-transform:lowercase}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pack{border:0;background:var(--surface)}
.pack .cover{background:linear-gradient(180deg,var(--wall) 0 58%,var(--floor) 58% 100%);color:var(--ink);padding:0;align-content:end}
.pack .cover b{background:var(--veil);padding:10px 14px;font-size:1.35rem}
.feature{background:var(--deep)}
.badge{background:var(--accent)}
.eyebrow{color:var(--accent-ink)}
.free{color:var(--rose)}
.feature .free{color:var(--on-deep)}
.eyebrow,.free,.tag{letter-spacing:.16em;text-transform:uppercase;font-size:.66rem}
.feature .btn{border-radius:2px}
.cta{background:var(--surface);border:1px solid var(--line)}
.specs b{font-weight:400}
.price{font-weight:400}
.about{grid-template-columns:1fr;justify-items:center;text-align:center;padding:28px 18px}
.about .foto{width:min(200px,100%);aspect-ratio:3/4;object-fit:cover;border-radius:2px;display:block}
.about ul{justify-items:center;list-style:none;padding:0}
/* Mi cuenta */
.acc-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:20px;display:grid;gap:14px}
.acc-card h2{font-size:1.7rem}
.pbar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:grid;gap:2px}
.stat b{font-size:1.6rem;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:lowercase}
details.week-d{background:var(--surface);border:1px solid var(--line);border-radius:2px}

.dir-t{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dir-t h3{flex-basis:100%}

.dir-horario{display:grid;gap:8px;padding:14px;background:var(--bg);border-radius:14px}
.dh-row{display:grid;grid-template-columns:130px 2fr 1.3fr 1fr 1fr;gap:8px;align-items:end}
.dh-row input[type=text],.dh-row input[type=time],.dh-row input[type=number],.dh-row select,.dh-para select,#d-tipo{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px;width:100%;min-width:0}

.neg{color:#B4433C}
.kpi b>span{font:inherit;color:inherit;letter-spacing:inherit}.kpi b>span.neg{color:#B4433C}
.neg-ed{display:grid;gap:12px}
.neg-ed input,.neg-ed select,.eq select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.neg-ed input:disabled{opacity:.7}
.neg-fijos{display:grid;gap:8px}
.neg-f{display:grid;grid-template-columns:2fr 1fr 1.1fr 1.3fr 1.2fr auto auto;gap:8px;align-items:end;padding:10px;background:var(--bg);border-radius:14px}
.neg-f input,.neg-f select{background:var(--surface)}
.neg-f label{font-size:.8rem}
.neg-m{font-size:.85rem;color:var(--muted);white-space:nowrap;padding-bottom:10px}
.neg-f .c-del{padding-bottom:10px}
.neg-com{max-width:360px}
.neg-p{display:grid;grid-template-columns:1fr 2fr 1fr 1.3fr auto;gap:8px;align-items:end}
.neg-h{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.eq{display:grid;gap:14px}
.eq .field{max-width:420px}
.kpi-neg b{color:#B4433C}.kpi-ok b{color:var(--accent-ink)}
.eq-loss{fill:#B4433C;opacity:.12}.eq-gain{fill:var(--accent);opacity:.35}
.eq-hoy{fill:var(--surface);stroke:var(--accent-ink);stroke-width:3}
.eq-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rent tr.top td{background:var(--surface)}
.eh{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.eh-b{width:70px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.eh-b i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
@media (max-width:760px){.neg-f{grid-template-columns:1fr 1fr}.neg-f .field:first-child{grid-column:1/-1}.neg-p{grid-template-columns:1fr 1fr}.neg-p .field:nth-child(2){grid-column:1/-1}}
@media (prefers-color-scheme:dark){.neg,.kpi-neg b{color:#E58C85}}
/* Ficha de cliente */
.cli-row{cursor:pointer}
.cli-row:hover td{background:var(--surface-2)}
.cli-n{font:inherit;color:var(--ink);text-decoration:none;font-weight:500;text-align:left;padding:0}
.cli-n:hover{color:var(--accent-ink);text-decoration:underline}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;margin:0}
.datos div{display:grid;gap:2px;min-width:0}
.datos dt{font-size:.8rem;color:var(--muted)}
.datos dd{margin:0;overflow-wrap:anywhere}
.cuest{display:grid;gap:6px;margin-top:6px}
.asig{display:grid;gap:10px;padding:14px;background:var(--bg);border-radius:14px}
.asig+.asig{margin-top:10px}
.asig-h{display:flex;gap:12px;justify-content:space-between;align-items:start;flex-wrap:wrap}
.asig-h>div{display:grid;gap:2px;min-width:0}
.asig-h .eyebrow{margin:0}
.asig-h span{font-size:.88rem;color:var(--muted)}
.asig-sem{display:grid;gap:8px}
.asig-w{display:grid;gap:6px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.asig-w.on{border-color:var(--accent);background:var(--surface)}
.asig-ss{display:flex;flex-wrap:wrap;gap:6px}
.asig-s{font-size:.85rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface)}
.asig-s.ok{background:var(--accent);border-color:var(--accent)}
.asig-plan{max-height:160px;overflow:auto}
/* Pago simulado */
.pago{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;align-items:start;max-width:880px}
.pago-form,.pago-ok{display:grid;gap:14px}
.pago-form h1,.pago-ok h1{font-size:2rem;font-weight:300;text-transform:none;margin:0}
.pago-form input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;min-width:0;letter-spacing:.03em}
.pago-form input:focus{border-color:var(--accent-ink);outline:none}
.pago-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pago-btn{width:100%;min-height:52px;font-size:1.05rem}
.pago-res{position:sticky;top:20px;display:grid;gap:6px;padding:20px;background:var(--surface);border-radius:20px}
.pago-imp{font-size:1.8rem;font-weight:200}
.pago-nota{margin:6px 0 0;font-size:.88rem;padding:10px 12px;border-radius:12px;background:var(--bg)}
.pago-test{margin:0;font-size:.82rem;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.pago-ok{grid-column:1/-1;justify-items:center;text-align:center;max-width:520px;margin:0 auto}
.pago-check{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:1.8rem;color:var(--ink)}
.pago-rec{text-align:left;width:100%;padding:16px;background:var(--surface);border-radius:16px}
@media (max-width:720px){.pago{grid-template-columns:1fr}.pago-res{position:static;order:-1}}
/* Pestañas de Mi cuenta */
.ctabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.ctabs button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.ctabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-ink)}
@media (max-width:480px){.ctabs button{padding:10px 8px;font-size:.88rem;flex:1 1 auto}}
/* Mi ciclo */
.ciclo-intro{display:grid;gap:12px;max-width:640px}
.ciclo-intro p{margin:0}
.ciclo-pts{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--muted)}
.ciclo-hoy{display:flex;flex-wrap:wrap;gap:12px}

.ciclo-hoy b{font-size:1.25rem;font-weight:400}
.cy-cal{display:grid;gap:10px}
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav b{font-weight:400;display:inline-block}.cal-nav b::first-letter{text-transform:uppercase}
.cy-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cy-h{font-size:.75rem;color:var(--muted);text-align:center}
.cy-d{font:inherit;font-size:.9rem;aspect-ratio:1;border-radius:50%;border:1.5px solid transparent;background:var(--bg);color:var(--ink);cursor:pointer;position:relative;padding:0}
.cy-d.regla{background:var(--accent-ink);color:#fff}
.cy-d.prevista{border:1.5px dashed var(--accent-ink)}
.cy-d.ovul{background:var(--accent)}
.cy-d.hoy{font-weight:600;text-decoration:underline}
.cy-d.sel{outline:2px solid var(--ink);outline-offset:1px}
.cy-d.con::after{content:'';position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cy-ley{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.cy-ley i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cy-ley i.regla{background:var(--accent-ink)}.cy-ley i.prevista{border:1.5px dashed var(--accent-ink)}.cy-ley i.ovul{background:var(--accent)}
.cy-dia,.cy-aj{display:grid;gap:12px}
.cy-dia textarea,.cy-aj input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.cy-aj .c-del{justify-self:start}
/* Strava */
.strava{display:grid;gap:14px}
.strava p{margin:0}
.st-tabla{min-width:0}
/* RPE */
.rpe-box{display:grid;gap:6px;justify-items:center;width:min(440px,100%)}
.rpe-esc{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%}
.rpe-n{font:inherit;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0}
.rpe-n[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-ink)}
.rpe-n:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.rpe-desc{font-size:.9rem;color:var(--accent-ink);min-height:1.3em}
.rpe-lista{display:grid;gap:6px}
.rpe-f{display:grid;grid-template-columns:1fr 90px 24px;gap:10px;align-items:center;font-size:.88rem}
.rpe-f>span:first-child{color:var(--muted)}
.rpe-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.rpe-bar i{display:block;height:100%;background:var(--accent-ink)}
/* Precios ocultos */
.c-web{background:var(--bg)}
.sin-precios .price,.sin-precios .chip-precio,.sin-precios .precio-txt,.sin-precios .pago-imp{display:none!important}
.c-precios small{font-size:.85rem}
/* Entrevista inicial */
.entrevista{display:grid;gap:10px}
.ent-personal{margin:0}
.ent-ficha select,.ent-ficha textarea,#v-tipo{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
/* Clientes por plan */
.cli-vista{justify-self:start}
.cli-picker{display:grid;gap:16px}
.cli-pk{display:grid;gap:8px}
.cli-pk h3{margin:0;font-size:.95rem;font-weight:500;text-transform:none;color:var(--muted)}
.cli-pk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cli-pk-it{font:inherit;text-align:left;display:grid;gap:2px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.cli-pk-it:hover{border-color:var(--accent-ink)}
.cli-pk-it span{font-size:.85rem;color:var(--muted)}
.cli-plan-h{display:grid;gap:6px}
.cli-plan-h h3{margin:0;font-size:1.3rem;font-weight:300;text-transform:none}
.cli-plan-h .cnt{font-size:.9rem;color:var(--muted)}
.cli-tabs{margin-bottom:4px}.cli-tabs .cnt-b{background:var(--line);color:var(--ink)}

.cli-g-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

.cli-g-it:hover{border-color:var(--accent-ink)}
.cli-g-it span{font-size:.85rem;color:var(--muted)}

.login-page{display:grid;gap:18px;justify-items:center}

.demo-list{display:grid;gap:6px}

.sol-mini .actions{margin-top:6px}

.pl-sug span{font-size:1.05rem}

.pl-esf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:.88rem;color:var(--muted)}

.pl-ult{margin:0;font-size:.88rem;color:var(--muted)}

.pl-rec{margin:0;color:var(--accent-ink);font-weight:600}
.marcas{display:grid;gap:8px}
.marca{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;background:var(--bg);border-radius:12px}

.pl-blk-h{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.pl-blk-h .field{flex:1 1 220px}

.pl-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

.fg{display:grid;gap:10px}

.fg-add{display:flex;gap:8px;flex-wrap:wrap}

const CONT_LOCAL=['migMujer','migSimple','migUUID','ejercicios','plantillas','planes','publicadas','pubPor'];   // estos van en sus propias tablas o son solo de este navegador   // marcas internas de este navegador: no se suben
let CONT_SUBIDO={},CONT_T=null,CONT_LISTO=false;
function contenidoSubir(){if(!SB||S.sesion!=='admin'||!CONT_LISTO) return;clearTimeout(CONT_T);CONT_T=setTimeout(async()=>{
 const filas=Object.keys(CONTENIDO).filter(k=>!CONT_LOCAL.includes(k)).map(k=>({clave:k,valor:CONTENIDO[k]??null,j:JSON.stringify(CONTENIDO[k]??null)})).filter(f=>CONT_SUBIDO[f.clave]!==f.j);
 if(!filas.length) return;
 const {error}=await SB.from('contenido_web').upsert(filas.map(f=>({clave:f.clave,valor:f.valor,actualizado:new Date().toISOString()})));
 if(error){console.warn('Supabase contenido:',error.message);S.avisoEmail='No se ha podido guardar en la nube. Se reintentará al guardar de nuevo.';}
 else filas.forEach(f=>CONT_SUBIDO[f.clave]=f.j);},700);}
async function contenidoBajar(){if(!SB) return;
 try{const {data,error}=await SB.from('contenido_web').select('clave,valor');if(error) throw error;
  let cambio=false;(data||[]).forEach(r=>{if(CONT_LOCAL.includes(r.clave)) return;const j=JSON.stringify(r.valor);CONT_SUBIDO[r.clave]=j;if(JSON.stringify(CONTENIDO[r.clave]??null)!==j){CONTENIDO[r.clave]=r.valor;cambio=true;}});
  CONT_LISTO=true;
  if(cambio){try{localStorage.setItem('cv-contenido',JSON.stringify(CONTENIDO));}catch(e){}if(typeof aplicarPrecios==='function'){const y=window.scrollY;render();window.scrollTo(0,y);}}
  if(!(data||[]).length&&S.sesion==='admin') contenidoSubir();   // primera vez: sube lo que hay en este navegador
 }catch(e){console.warn('Supabase contenido:',e&&e.message||e);setTimeout(contenidoBajar,20000);}}   // sin conexión: no se sube nada hasta poder comparar con la nube

function hoyISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function semanasHasta(iso){if(!iso) return null;const ms=new Date(iso+'T00:00:00')-new Date(hoyISO()+'T00:00:00');return Math.max(0,Math.floor(ms/6048e5));}
function fechaLarga(iso){try{return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});}catch(e){return iso;}}
function asignarRunner(r){
 if(r.lesion==='actual') return {entrenador:true,avisos:[]};
 const base=+r.continuo,ant=+r.antiguedad,avisos=[];
 let sp={empezar:'iniciacion','5k':'5k','10k':'10k',media:'media',maraton:'maraton'}[r.objetivo];
 if(base===0&&sp!=='iniciacion'){avisos.push('Para preparar una distancia conviene poder correr al menos 10 minutos seguidos, así que empezamos por aquí.');sp='iniciacion';}
 if(sp==='media'&&base<2){avisos.push('Para la media maratón conviene correr al menos 30 minutos seguidos. Primero ganamos base con el plan de 10K.');sp='10k';}
 if(sp==='maraton'&&(base<3||ant<2)){avisos.push('Para el maratón conviene correr más de 1 hora seguida y llevar al menos 6 meses corriendo.');sp=base>=2?'media':'10k';}
 const sem=semanasHasta(r.carrera==='si'?r.fechaCarrera:null);
 if(sem!==null&&sem<8&&['media','maraton'].includes(r.objetivo)) avisos.push(`Tu carrera es dentro de ${sem} ${sem===1?'semana':'semanas'}: te recomendamos revisar el plan con tu entrenadora.`);
 else if(sem!==null&&sem<4) avisos.push(`Tu carrera es dentro de ${sem} ${sem===1?'semana':'semanas'}: el plan se adaptará al tiempo que queda.`);
 if(+r.diasEntreno<=2&&['media','maraton'].includes(sp)) avisos.push(`Con ${r.diasEntreno} ${+r.diasEntreno===1?'día':'días'} por semana el plan será más ajustado. Si puedes llegar a 3 días, mejor.`);
 return {entrenador:false,sp,avisos};
}

function evaluarPostparto(r){
 const sem=Math.floor((new Date(hoyISO()+'T00:00:00')-new Date(r.fechaParto+'T00:00:00'))/6048e5);
 const esperar=r.alta!=='si';
 const derivar=[];
 if(r.escapes==='frecuentes') derivar.push('escapes de orina frecuentes');
 if(r.bulto==='si') derivar.push('sensación de peso o bulto vaginal');
 if(r.dolorPelvico==='si') derivar.push('dolor pélvico o perineal');
 if(r.diastasis==='si') derivar.push('diástasis abdominal');
 if(r.tipoParto==='cesarea'&&r.cicatriz==='si') derivar.push('molestias en la cicatriz de la cesárea');
 const avisos=[];
 if(r.fisio!=='si') avisos.push('Te recomendamos una revisión del suelo pélvico con fisioterapia antes de aumentar la intensidad.');
 if(r.escapes==='esfuerzo') avisos.push('Los escapes al toser o saltar son frecuentes tras el parto: el plan empezará sin impactos y con trabajo de suelo pélvico.');
 if(r.diastasis==='nose') avisos.push('Pide que te valoren la diástasis abdominal en tu próxima revisión.');
 if(r.sueno==='<4') avisos.push('Con tan poco descanso, prioriza sesiones cortas y suaves. El sueño también es recuperación.');
 return {sem,esperar,derivar,avisos};
}

function fmtMarca(v,u){if(v==null||isNaN(v)) return '—';if(u==='mmss'){const m=Math.floor(v/60),s=Math.round(v-m*60);return `${m}:${String(s).padStart(2,'0')}`;}if(u==='s') return `${String(Math.round(v*10)/10).replace('.',',')} s`;return `${v} ${v===1?'rep.':'reps.'}`;}
function parseMarca(t,u){if(t==null) return null;t=String(t).trim().replace(',','.');if(!t) return null;
 if(u==='mmss'){const m=t.match(/^(\d{1,2})[:'.](\d{1,2})$/);if(m) return +m[1]*60+ +m[2];const n=+t;return isNaN(n)?null:n;}
 const n=+t;return isNaN(n)?null:n;}
const grupoEdad=e=>+e<35?0:+e<=40?1:2;
const mejorQue=(pr,a,b)=>pr.mejor==='menor'?a<=b:a>=b;
function puntosPN(pr,sx,v){const a=pr.bar[sx];for(let i=0;i<10;i++) if(mejorQue(pr,v,a[i])) return 10-i;return 0;}
function evaluarOpos(op,sx,edad,marcas){
 const O=OPOS[op],g=grupoEdad(edad);
 const filas=O.pruebas.map(pr=>{const u=pr.unidad[sx],v=marcas[pr.id];
  if(v==null) return {pr,u,v,sin:true,nombre:pr.nombre[sx]};
  if(O.tipo==='nota'){const pts=puntosPN(pr,sx,v),obj=pr.bar[sx][5];return {pr,u,v,pts,obj,falta:pts<5,nombre:pr.nombre[sx]};}
  const min=pr.min[sx][g];return {pr,u,v,min,apto:mejorQue(pr,v,min),nombre:pr.nombre[sx]};});
 const con=filas.filter(f=>!f.sin);
 let res;
 if(O.tipo==='nota'){const media=con.length?con.reduce((a,f)=>a+f.pts,0)/O.pruebas.length:0;const cero=con.some(f=>f.pts===0);res={media:Math.round(media*100)/100,completo:con.length===O.pruebas.length,apto:con.length===O.pruebas.length&&!cero&&media>=5,cero};}
 else res={completo:con.length===O.pruebas.length,apto:con.length===O.pruebas.length&&con.every(f=>f.apto)};
 return {O,filas,...res};
}

function bindVideo(re){

  for(let k=0;k<n;k++){const dt=new Date(f+'T00:00:00');dt.setDate(dt.getDate()+7*k);const fe=isoDe(dt);if(!C.huecos.some(x=>x.fecha===fe&&x.hora===h)) C.huecos.push({id:'v'+Date.now()+k,fecha:fe,hora:h,dur:d,reserva:null,tipo:g('v-tipo').value});}

function infoPrograma(){
 const c=S.cuenta.prog;if(!c) return null;
 const p=todosProgramas().find(x=>x.id===c.id);if(!p) return null;
 const sub=c.sub&&p.subplanes?p.subplanes.find(x=>x.id===c.sub):null;
 const {semanas,total,porSemana}=estructuraProg(p,sub);
 return {p,sub,nombre:sub?`${p.nombre} · ${sub.nombre}`:p.nombre,semanas,total,porSemana,ejemplo:!(parseInt((sub&&sub.semanas)||p.semanas)&&parseInt(p.sesiones))};
}

function barras(vals,max,labs,actual){
 const W=360,H=200,L=28,B=26,T=20,w=(W-L-10)/vals.length,bw=Math.min(36,w*.55),y=v=>T+(H-T-B)*(1-v/max);

  ${ticks.map(t=>`<line x1="${L}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" class="g-grid"/><text x="${L-8}" y="${y(t)+4}" class="g-ax" text-anchor="end">${t}</text>`).join('')}
  ${vals.map((v,i)=>{const x=L+w*i+(w-bw)/2,h=Math.max(0,y(0)-y(v));return `<g><title>Semana ${labs[i]}: ${v} de ${max} sesiones</title>
   <rect x="${L+w*i}" y="${T}" width="${w}" height="${H-T-B}" fill="transparent"/>
   ${v?`<path d="M${x},${y(0)} v${-(h-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4} z" class="${i+1===actual?'g-bar-on':'g-bar'}"/>`:''}
   ${v?`<text x="${x+bw/2}" y="${y(v)-6}" class="g-val" text-anchor="middle">${v}</text>`:''}
   <text x="${x+bw/2}" y="${H-8}" class="g-ax" text-anchor="middle">S${labs[i]}</text></g>`;}).join('')}
 </svg>`;
}

 return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="${nombre}">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="g-grid"/><text x="${L-8}" y="${y(t)+4}" class="g-ax" text-anchor="end">${t}</text>`).join('')}

  ${vals.map((v,i)=>`<g><title>Semana ${labs[i]}: ${fmt(v)}</title><circle cx="${x(i)}" cy="${y(v)}" r="14" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="5" class="g-dot"/>

 </svg>`;
}

 $app.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{S.ptab='mensajes';S.pcSel=b.dataset.pc||null;S.pcNuevo=false;S.pcBorrador='';re();const c=document.getElementById('p-chat');if(c&&S.pcSel) c.scrollIntoView({block:'start'});});
 const n=document.getElementById('pc-nuevo');if(n) n.onclick=()=>{S.pcNuevo=!S.pcNuevo;re();};

 $app.querySelectorAll('[data-rapida]').forEach(b=>b.onclick=()=>{S.pcBorrador=RESP_RAPIDAS[+b.dataset.rapida];re('pc-txt');});

const nombreLocal=()=>((S.cuenta.auth&&S.cuenta.auth.nombre)||(S.cuenta.solicitud&&S.cuenta.solicitud.nombre)||'Cliente').trim();
const hayLocal=()=>!!(S.cuenta.auth||(S.cuenta.entrenador&&S.cuenta.solicitud));
function planLocal(){const C=S.cuenta,I=infoPrograma(),L=[];
 if(C.entrenador) L.push(`Entrenamiento personal · ${nombreMod(C.solicitud&&C.solicitud.modalidad)}`);
 if(I) L.push(I.nombre);
 if(C.solProg) L.push(`${nombreSol(C.solProg)} (pendiente)`);
 if(C.packs.length) L.push(`${C.packs.length} ${C.packs.length===1?'pack':'packs'} de Entrena conmigo`);
 if(C.dirPlan) L.push(`Directos · ${C.dirPlan.nombre}`);
 return L;}
function estadoLocal(){const C=S.cuenta;if((C.entrenador&&C.estado==='pendiente')||(C.solProg&&!infoPrograma())) return 'pendiente';if(C.pausa) return 'pausa';return planLocal().length?'activo':'sin plan';}

function tareasHoy(){
 const T=[],hoy=hoyISO();
 clientes().forEach(c=>conCuenta(c,()=>tareasCliente().forEach(t=>T.push({...t,cli:c.id}))));
 chatsAdmin().forEach(c=>{const n=noLeidos(c);if(n) T.push({tipo:'Mensaje',t:`Responder a ${c.nombre}`,d:`${n} ${n===1?'mensaje sin leer':'mensajes sin leer'}`,a:'chat:'+c.id,cli:c.id});});
 S.cuenta.directos.filter(d=>d.fecha===hoy&&dirEstado(d)!=='terminada').forEach(d=>T.push({tipo:'Hoy',t:`Clase en directo «${d.titulo}» a las ${d.hora}`,d:`${apuntados(d)} ${apuntados(d)===1?'persona apuntada':'personas apuntadas'}`,a:'sala:'+d.id}));
 pasados().filter(d=>!d.grab).slice(0,3).forEach(d=>T.push({tipo:'Grabación',t:`Subir la grabación de «${d.titulo}»`,d:fechaDirecto(d),a:'sala:'+d.id}));
 const PP=porPublicar(),lunes=PP.filter(x=>!x.ahora);
 PP.filter(x=>x.ahora).forEach(x=>T.push({tipo:'Planes',t:`Publicar la semana ${x.w} · ${nombrePlanK(x.k)}`,d:`Ya la están haciendo: ${x.cli.join(', ')}`,a:'plan:'+x.k+'#'+x.w,alerta:true}));
 if(lunes.length) T.push({tipo:'Planes',t:lunes.length===1?`Publicar la semana ${lunes[0].w} · ${nombrePlanK(lunes[0].k)}`:`Preparar ${lunes.length} semanas para el lunes`,d:lunes.length===1?`La empiezan el lunes: ${lunes[0].cli.join(', ')}`:lunes.map(x=>`${nombrePlanK(x.k)} (semana ${x.w})`).join(' · '),a:'plan:'+lunes[0].k+'#'+lunes[0].w});
 const orden={Programa:0,Personal:0,Planes:0,Esfuerzo:0,Técnica:1,Mensaje:1,Valoración:1,Embarazo:1,Registro:2,Hoy:0};return T.sort((a,b)=>(orden[a.tipo]??3)-(orden[b.tipo]??3));
}
function tareasCliente(){
 const C=S.cuenta,hoy=hoyISO(),nom=nombreLocal(),T=[];
 if(C.solProg) T.push({tipo:'Programa',t:`Revisar y enviar el programa de ${nom}`,d:nombreSol(C.solProg),a:'solicitudes'});
 if(C.entrenador&&C.estado==='pendiente') T.push({tipo:'Personal',t:`Preparar el plan personal de ${nom}`,d:`Entrenamiento personal · ${nombreMod(C.solicitud&&C.solicitud.modalidad)}`,a:'ficha'});
 (C.tecnica||[]).filter(t=>t.estado==='pendiente').forEach(t=>T.push({tipo:'Técnica',t:`Corregir la técnica de ${nom}`,d:`${t.ej} · enviado el ${fechaCorta(t.fecha)}`,a:'tec'}));
 if(C.registros.length>(C.regRevisado||0)){const r=C.registros[C.registros.length-1];T.push({tipo:'Registro',t:`Revisar el registro semanal de ${nom}`,d:`Semana ${r.semana} · RPE ${r.rpe}${r.mol==='si'?' · ha tenido molestias':''}`,a:'ficha',alerta:r.mol==='si'});}
 if(C.regEmb.length>(C.regEmbRev||0)){const r=C.regEmb[C.regEmb.length-1];T.push({tipo:'Embarazo',t:`Revisar el registro de embarazo de ${nom}`,d:r.vb==='no'?'Ya no tiene el visto bueno médico':`Semana ${r.sem} de embarazo`,a:'ficha',alerta:r.vb==='no'});}
 Object.entries(C.valor).filter(([,v])=>v.estrellas<=2&&!v.visto).forEach(([k,v])=>T.push({tipo:'Valoración',t:`Valoración baja de ${nom}`,d:`${'★'.repeat(v.estrellas)} · ${v.titulo}${v.com?` · «${v.com}»`:''}`,a:'val:'+k,alerta:true}));
 C.huecos.filter(x=>x.reserva===C.id&&x.fecha===hoy).forEach(x=>T.push({tipo:'Hoy',t:`${esEnt(x)?'Entrevista inicial':'Videollamada'} con ${nom} a las ${x.hora}`,d:`${x.dur} min`,a:esEnt(x)?'ficha':'agenda',link:C.enlaceVideo}));
 C.huecos.filter(x=>esEnt(x)&&x.reserva===C.id&&x.fecha<hoy&&!(C.entrevista&&C.entrevista.hecha)).forEach(x=>T.push({tipo:'Entrevista',t:`Apuntar los datos de la entrevista de ${nom}`,d:`Fue el ${fechaCorta(x.fecha)}`,a:'ficha'}));
 const I=infoPrograma();
 const ultF=Object.entries(C.hechasFecha||{}).filter(([k])=>C.hechas[k]).map(x=>String(x[1]).slice(0,10)).sort().pop();
 if(I&&!I.p.clases&&!C.pausa){const n=diasEntre(String(ultF||C.ultimo||C.inicio||hoy).slice(0,10),hoy);if(n>=(FN.chat?4:7)) T.push({tipo:'Seguimiento',t:FN.chat?`Escribir a ${nom}`:`${nom} lleva ${n} días sin entrenar`,d:FN.chat?`Lleva ${n} días sin entrenar`:'Puede ser buen momento para escribirle',a:FN.chat?'chat:'+C.id:'ficha'});}
 Object.entries(C.rpe||{}).filter(([k,v])=>v&&v.rpe>=9&&String(v.fecha).slice(0,10)>=sumarDias(hoy,-6)&&!(C.rpeVisto||{})[k]).forEach(([k,v])=>T.push({tipo:'Esfuerzo',t:`${nom} marcó RPE ${v.rpe}`,d:`${tituloClave(k)} · ${fechaCorta(v.fecha)}`,a:'rpe:'+k,alerta:true}));
 if(C.entrenador&&C.estado==='activo'&&C.fecha&&C.fecha.slice(8,10)===hoy.slice(8,10)&&C.fecha.slice(0,10)!==hoy) T.push({tipo:'Revisión',t:`Revisión mensual de ${nom}`,d:'Revisa su informe de progreso y ajusta el plan',a:'ficha'});
 const ev=[[C.opo&&C.opo.fechaExamen,'su examen físico'],[S.resp.runners&&S.resp.runners.carrera==='si'&&S.resp.runners.fechaCarrera,'su carrera'],[C.fpp,'su fecha probable de parto']];
 ev.forEach(([f,t])=>{if(f){const n=diasEntre(hoy,f);if(n>=0&&n<=14) T.push({tipo:'Próximamente',t:`${nom}: quedan ${n} días para ${t}`,d:fechaLarga(f),a:'ficha'});}});
 return T;
}

const PASOS_DE={runners:()=>RUNNERS_PASOS,embarazo:()=>EMB_PASOS,postparto:()=>PP_PASOS,opos:()=>OPO_PASOS,menopausia:()=>MENO_PASOS,fuerza:()=>FUERZA_PASOS,hibrido:()=>HIB_PASOS};
function resumenGen(origen,r){

 try{h=f().map(P=>{const cs=P.campos.filter(c=>!['info','aviso'].includes(c.tipo)&&!(c.oculto&&c.oculto(r)));if(!cs.length) return '';

 finally{S.r=prev;}
 return h;
}

/* ---------- Gestión de contenido ---------- */
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const ks=p.split('.'),last=ks.pop(),t=ks.reduce((a,k)=>a[k],o);t[last]=v;}
const CSEC=[['programas','Programas'],['pilates','Entrena conmigo'],['sesiones','Sesiones guiadas'],...(FN.rutinasPortada?[['rutinas','Rutinas de la portada']]:[]),['personal','Entrenamiento personal, directos y ciclo'],['web','Sobre mí, testimonios y reto']];
function ci(path,label,tipo,ph){tipo=tipo||'txt';const v=getP(CONTENIDO,path),id='c_'+path.split('.').join('_');
 const val=tipo==='lineas'?(v||[]).join('\n'):tipo==='lista'?(v||[]).join(', '):(v==null?'':v);
 const ctrl=(tipo==='area'||tipo==='lineas')?`<textarea id="${id}" data-c="${path}" data-ct="${tipo}" rows="${tipo==='lineas'?4:3}" placeholder="${esc(ph||'')}">${esc(val)}</textarea>`
  :`<input id="${id}" type="${tipo==='num'?'number':'text'}" data-c="${path}" data-ct="${tipo}" value="${esc(val)}" placeholder="${esc(ph||'')}">`;
 return `<div class="field">${label?`<label for="${id}">${label}</label>`:''}${ctrl}</div>`;}
const cdel=(path,txt)=>`<button class="link c-del" data-cdel="${path}">${txt||'Quitar'}</button>`;
const cadd=(path,tpl,txt)=>`<button class="btn ghost sm" data-cadd="${path}" data-tpl="${tpl}">${txt}</button>`;
const det=(k,tit,inner,sub)=>`<details class="c-det" data-dk="${k}"><summary><b>${esc(tit||'Sin nombre')}</b>${sub?`<span>${esc(sub)}</span>`:''}</summary><div class="c-body">${inner}</div></details>`;

 let h=`<div class="c-grid">${ci(path+'.nombre','Nombre')}${ci(path+'.precio','Precio','txt','Ej.: 14,99 €/mes')}${ci(path+'.semanas','Semanas')}${ci(path+'.sesiones','Sesiones en total')}${ci(path+'.nivel','Nivel')}</div>${ci(path+'.para','Para quién es')}${ci(path+'.descripcion','Descripción','area')}`;
 if(p.subplanes) h+=`<div class="c-sub"><span class="lbl">Planes dentro de ${esc(p.nombre)}</span>${p.subplanes.map((sp,j)=>`<div class="c-item"><div class="c-grid">${ci(`${path}.subplanes.${j}.nombre`,'Nombre')}${'semanas' in sp?ci(`${path}.subplanes.${j}.semanas`,'Semanas'):''}</div>${ci(`${path}.subplanes.${j}.descripcion`,'Descripción','area')}</div>`).join('')}</div>`;
 return h;}

function tplContenido(t,arrPath){
 if(t==='cifra') return {valor:'',texto:''};
 if(t==='metodo') return {titulo:'',texto:''};
 if(t==='esp') return {nombre:'',destino:''};
 if(t==='form') return {titulo:'',centro:'',anio:''};
 if(t==='hito') return {anio:'',texto:''};
 if(t==='faq') return {p:'',r:''};
 if(t==='clase') return {titulo:'',minutos:'',nivel:''};
 if(t==='ej') return {nombre:'',series:3,reps:'',descanso:60,alternativas:[]};
 if(t==='ejt') return {nombre:'',tiempo:60};
 if(t==='video') return {titulo:'',modalidad:'Fuerza',material:'Sin material',minutos:15};
 if(t==='testimonio') return {texto:'',nombre:'',programa:''};
 if(t==='par') return ['',''];
 if(t==='pack'){const arr=getP(CONTENIDO,arrPath);let n=arr.length+1;while(arr.some(x=>x.id==='pilates-'+n)) n++;return {id:'pilates-'+n,nombre:'Pack '+n,para:'',descripcion:'',precio:'',clases:[{titulo:'',minutos:'',nivel:''}]};}
}

const MEDIA={db:null,urls:{}};
function mediaDB(){return new Promise((ok,ko)=>{if(MEDIA.db) return ok(MEDIA.db);try{const r=indexedDB.open('castro-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>{MEDIA.db=r.result;ok(r.result);};r.onerror=()=>ko(r.error);}catch(e){ko(e);}});}
function mediaPut(k,blob){if(SB&&S.sesion==='admin'&&MEDIA_NUBE(k)) SB.storage.from('contenido').upload(k,blob,{upsert:true,contentType:blob.type||undefined}).then(({error})=>{if(error) console.warn('Supabase archivo:',error.message);});return mediaDB().then(db=>new Promise((ok,ko)=>{const t=db.transaction('m','readwrite');t.objectStore('m').put(blob,k);t.oncomplete=()=>{if(MEDIA.urls[k]){URL.revokeObjectURL(MEDIA.urls[k]);delete MEDIA.urls[k];}ok();};t.onerror=()=>ko(t.error);}));}
function mediaGet(k){if(MEDIA.urls[k]) return Promise.resolve(MEDIA.urls[k]);return mediaDB().then(db=>new Promise((ok,ko)=>{const r=db.transaction('m').objectStore('m').get(k);r.onsuccess=()=>{if(!r.result){if(SB&&/^tec-/.test(k)&&TEC_RUTA[k.slice(4)]) return SB.storage.from('tecnica').createSignedUrl(TEC_RUTA[k.slice(4)],3600).then(({data})=>{if(data&&data.signedUrl){MEDIA.urls[k]=data.signedUrl;ok(data.signedUrl);}else ok(null);}).catch(()=>ok(null));if(!SB||!MEDIA_NUBE(k)) return ok(null);const u=mediaURLPublica(k);return fetch(u,{method:'HEAD'}).then(x=>{if(x.ok){MEDIA.urls[k]=u;ok(u);}else ok(null);}).catch(()=>ok(null));}MEDIA.urls[k]=URL.createObjectURL(r.result);ok(MEDIA.urls[k]);};r.onerror=()=>ko(r.error);}));}
function mediaDel(k){if(SB&&S.sesion==='admin'&&MEDIA_NUBE(k)) SB.storage.from('contenido').remove([k]).catch(()=>{});if(MEDIA.urls[k]){URL.revokeObjectURL(MEDIA.urls[k]);delete MEDIA.urls[k];}return mediaDB().then(db=>{db.transaction('m','readwrite').objectStore('m').delete(k);}).catch(()=>{});}

 if(g('fg-nuevo')){enter(g('fg-nuevo-n'),g('fg-nuevo'));g('fg-nuevo').onclick=()=>{const v=g('fg-nuevo-n').value.trim();if(!v) return;let n=FL.length+1;while(FL.some(f=>f.id==='f'+n)) n++;FL.push({id:'f'+n,nombre:v,opciones:[]});guarda();const x=$app.querySelector(`[data-fgop-new="f${n}"]`);if(x) x.focus();};}
 $app.querySelectorAll('[data-fnew-ok]').forEach(b=>{const id=b.dataset.fnewOk,inp=$app.querySelector(`[data-fnew="${id}"]`);enter(inp,b);
  b.onclick=()=>{const v=inp.value.trim(),f=fg(id);inp.value='';if(!v) return;const ya=f.opciones.find(o=>normEj(o)===normEj(v));

 if(!g('ej-guardar')) return;

 g('ej-guardar').onclick=async()=>{const msg=g('ej-msg'),nombre=g('ej-nombre').value.trim(),err=t=>{msg.textContent=t;msg.hidden=false;g('ej-guardar').disabled=false;};

 if(g('ej-quitar-vid')) g('ej-quitar-vid').onclick=()=>{const e=ejPorId(S.ejEdit);mediaDel('ej-'+e.id);e.archivo=null;guardarContenido();re();};

/* ---------- Plantillas de sesión y planificación de programas ---------- */
function nuevoEjPl(ej,b){const conSeries=!/calent|calma/i.test(b.nombre);return conSeries?{ejId:ej.id,nombre:ej.nombre,series:3,reps:'',tiempo:0,descanso:60,alternativas:[],nota:''}:{ejId:ej.id,nombre:ej.nombre,series:1,reps:'',tiempo:60,descanso:0,alternativas:[],nota:''};}
function destinosPlan(){const L=[];todosProgramas().filter(p=>!p.clases&&!progOculto(p)).forEach(p=>{if(p.subplanes) p.subplanes.forEach(sp=>L.push({k:p.id+'/'+sp.id,n:`${p.nombre} · ${sp.nombre}`,p,sub:sp}));else L.push({k:p.id,n:p.nombre,p,sub:null});});return L;}
function plOpciones(sel){const L=CONTENIDO.ejercicios.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')),f=CONTENIDO.ejFiltros[0],G={};
 L.forEach(e=>{const g=(f&&((e.tags||{})[f.id]||[])[0])||'Sin clasificar';(G[g]=G[g]||[]).push(e);});
 return Object.keys(G).length>1?Object.entries(G).map(([g,es])=>`<optgroup label="${esc(g)}">${es.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nombre)}</option>`).join('')}</optgroup>`).join(''):L.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nombre)}</option>`).join('');}
/* ---------- Adaptaciones de una sesión: las define la entrenadora en cada plantilla; la app solo aplica esas ---------- */
const ESTADOS_AD=[['muy_cansado','Muy cansado/a'],['cansado','Cansado/a'],['molestias','Con alguna molestia'],['poco_tiempo','Con poco tiempo'],['otro','Otro (lo escribes tú)']];
const TIPOS_AD=[['series','Quitar series'],['quitar_ej','Quitar un ejercicio'],['quitar_bloque','Quitar un bloque'],['alternativa','Usar la alternativa de un ejercicio'],['reps','Cambiar repeticiones o tiempo']];
const etqAd=a=>a.cuando==='otro'?(a.texto||'Otro'):((ESTADOS_AD.find(x=>x[0]===a.cuando)||[0,a.cuando])[1]);
const claveEjAd=(b,x)=>`${b.nombre}::${x.nombre}`;
function nomEjAd(k){const [b,e]=String(k||'').split('::');return e?`${e} (${String(b).toLowerCase()})`:'';}
function descCambio(c){const n=+c.n||1;
 if(c.tipo==='series') return `${n===1?'1 serie':n+' series'} menos ${c.ej==='todos'||!c.ej?'en cada ejercicio':'en '+nomEjAd(c.ej)}`;
 if(c.tipo==='quitar_ej') return c.ej?`sin ${nomEjAd(c.ej)}`:'';
 if(c.tipo==='quitar_bloque') return c.b?`sin el bloque «${c.b}»`:'';
 if(c.tipo==='alternativa') return c.ej?`${nomEjAd(c.ej)} se cambia por su alternativa`:'';
 if(c.tipo==='reps') return c.ej&&c.valor?`${nomEjAd(c.ej)}: ${c.valor}`:'';
 return '';}
const descAd=a=>(a.cambios||[]).map(descCambio).filter(Boolean).join(' · ')||'Sin cambios definidos todavía';
// Copia de la plantilla con los cambios de esa adaptación (no toca la original)
function plantillaAdaptada(pl,ad){if(!pl||!ad) return pl;const C=JSON.parse(JSON.stringify(pl)),es=(b,x,k)=>!k||k==='todos'||claveEjAd(b,x)===k;
 (ad.cambios||[]).forEach(c=>{
  if(c.tipo==='quitar_bloque') C.bloques=C.bloques.filter(b=>b.nombre!==c.b);
  else if(c.tipo==='quitar_ej') C.bloques.forEach(b=>{b.ejercicios=b.ejercicios.filter(x=>claveEjAd(b,x)!==c.ej);});
  else C.bloques.forEach(b=>b.ejercicios.forEach(x=>{if(!es(b,x,c.tipo==='series'?c.ej:c.ej||'-')) return;
   if(c.tipo==='series') x.series=Math.max(1,(+x.series||1)-(+c.n||1));
   else if(c.tipo==='alternativa'&&(x.alternativas||[]).length){const n=x.alternativas[0],e=CONTENIDO.ejercicios.find(z=>z.nombre.toLowerCase()===n.toLowerCase());x.nombre=n;if(e) x.ejId=e.id;else delete x.ejId;}
   else if(c.tipo==='reps'&&c.valor){if(x.tiempo) x.tiempo=Math.max(1,parseInt(c.valor)||x.tiempo);else x.reps=String(c.valor);}}));});
 C.bloques=C.bloques.filter(b=>b.ejercicios.length);return C;}
function adaptacionesHTML(pl){const A=pl.adaptaciones||[],ejs=pl.bloques.flatMap(b=>b.ejercicios.map(x=>[claveEjAd(b,x),`${x.nombre} · ${b.nombre}`,x]));
 const opEj=(sel,todos,soloAlt)=>`${todos?`<option value="todos" ${sel==='todos'||!sel?'selected':''}>Todos los ejercicios</option>`:'<option value="">Elige un ejercicio</option>'}${ejs.filter(([,,x])=>!soloAlt||(x.alternativas||[]).length).map(([k,t])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(t)}</option>`).join('')}${sel&&sel!=='todos'&&!ejs.some(([k])=>k===sel)?`<option value="${esc(sel)}" selected>${esc(nomEjAd(sel))} (ya no está)</option>`:''}`;
 return `<div class="c-sub pl-adapt"><p class="eyebrow">Adaptaciones</p><h3>Si el cliente no llega bien</h3>
  <p class="sec-sub">Tú decides qué cambia y en qué caso. Antes de empezar, el cliente elige cómo llega y, si coincide con una de estas, hace esa versión. La app no cambia nada que no esté aquí. Tú verás en su ficha qué versión hizo.</p>
  ${A.map((a,ai)=>`<div class="c-item ad-item"><div class="c-grid"><div class="field"><label for="ad_c_${ai}">Si llega…</label><select id="ad_c_${ai}" data-adc="${ai}">${ESTADOS_AD.map(([v,t])=>`<option value="${v}" ${v===a.cuando?'selected':''}>${t}</option>`).join('')}</select></div>
    ${a.cuando==='otro'?`<div class="field"><label for="ad_t_${ai}">¿Cómo lo verá el cliente?</label><input id="ad_t_${ai}" type="text" data-adt="${ai}" value="${esc(a.texto||'')}" placeholder="Ej.: He dormido muy poco"></div>`:''}</div>
   ${(a.cambios||[]).map((c,ci)=>`<div class="ad-cambio"><select data-adk="${ai}.${ci}" aria-label="Tipo de cambio">${TIPOS_AD.map(([v,t])=>`<option value="${v}" ${v===c.tipo?'selected':''}>${t}</option>`).join('')}</select>
     ${c.tipo==='series'?`<input type="number" min="1" max="9" data-adn="${ai}.${ci}" value="${+c.n||1}" aria-label="Cuántas series"><select data-ade="${ai}.${ci}" aria-label="Ejercicio">${opEj(c.ej,true)}</select>`
      :c.tipo==='quitar_bloque'?`<select data-adb="${ai}.${ci}" aria-label="Bloque"><option value="">Elige un bloque</option>${pl.bloques.map(b=>`<option value="${esc(b.nombre)}" ${b.nombre===c.b?'selected':''}>${esc(b.nombre)}</option>`).join('')}</select>`
      :`<select data-ade="${ai}.${ci}" aria-label="Ejercicio">${opEj(c.ej,false,c.tipo==='alternativa')}</select>${c.tipo==='reps'?`<input type="text" data-adv="${ai}.${ci}" value="${esc(c.valor||'')}" placeholder="Ej.: 8 o 30 (segundos)" aria-label="Nuevo valor">`:''}`}
     <button class="link c-del" data-adcx="${ai}.${ci}">Quitar</button></div>`).join('')}
   <p class="ad-res"><b>${esc(etqAd(a))}:</b> ${esc(descAd(a))}</p>
   <div class="actions"><button class="btn ghost sm" data-adadd="${ai}">Añadir cambio</button><button class="link c-del" data-adx="${ai}">Quitar esta adaptación</button></div></div>`).join('')}
  <div class="actions"><button class="btn ghost sm" id="ad-nueva">${A.length?'Añadir otra adaptación':'Añadir una adaptación'}</button></div></div>`;}

/* ---------- Planes: cada plan (programa, subplan o entrenamiento personal) tiene sus plantillas y sus semanas ---------- */
const ES_UUID=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||''));
function nuevoUUID(){try{if(crypto.randomUUID) return crypto.randomUUID();}catch(e){}
 const h=[...crypto.getRandomValues(new Uint8Array(16))];h[6]=h[6]&15|64;h[8]=h[8]&63|128;const x=h.map(b=>b.toString(16).padStart(2,'0')).join('');
 return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}`;}
// Identificador fijo a partir de un texto (el mismo texto da siempre el mismo id)
function uuidDe(s){const b=new TextEncoder().encode(String(s)),h=[];
 for(let j=0;j<4;j++){let x=(0x811c9dc5^Math.imul(j+1,0x9e3779b9))>>>0;for(const c of b){x^=c;x=Math.imul(x,0x01000193)>>>0;}for(let i=b.length-1;i>=0;i--){x^=b[i]+j;x=Math.imul(x^(x>>>15),0x5bd1e995)>>>0;}h.push(x>>>0);}
 const t=h.map(v=>v.toString(16).padStart(8,'0')).join('').split('');t[12]='5';t[16]=((parseInt(t[16],16)&3)|8).toString(16);const z=t.join('');
 return `${z.slice(0,8)}-${z.slice(8,12)}-${z.slice(12,16)}-${z.slice(16,20)}-${z.slice(20)}`;}
const esPersonalK=k=>String(k||'').startsWith('P:');
function duenoPlan(k){if(esPersonalK(k)) return {id_contratacion:k.slice(2)};const [id,sub]=String(k).split('/');return idsPrograma(id,sub||null);}
function planDeFila(f,subs){if(f.id_contratacion) return 'P:'+f.id_contratacion;const p=progDeFila(f,subs||{});return p.sub?p.id+'/'+p.sub:p.id;}
function clientePlanP(k){return clientes().find(c=>c.sbPersonal&&('P:'+c.sbPersonal)===k)||null;}
function estrPersonal(c){const e=(c&&c.estrP)||{},semanas=+e.semanas||4,porSemana=+e.porSemana||3;return {semanas,porSemana,total:semanas*porSemana};}
function estrPlan(k){
 if(esPersonalK(k)) return estrPersonal(esStaff()?clientePlanP(k):S.cuenta);
 const [id,sub]=String(k).split('/'),p=todosProgramas().find(x=>x.id===id);
 return p?estructuraProg(p,sub&&p.subplanes?p.subplanes.find(x=>x.id===sub):null):{semanas:4,porSemana:3,total:12};}
const plsDe=k=>(CONTENIDO.plantillas||[]).filter(p=>p.plan===k);
const pubDe=k=>Object.keys(((CONTENIDO.publicadas||{})[k])||{}).map(Number).sort((a,b)=>a-b);
const semPublicada=(k,w)=>!!(((CONTENIDO.publicadas||{})[k]||{})[w]);
const progK=()=>{const c=S.cuenta.prog;return c?(c.sub?c.id+'/'+c.sub:c.id):null;};
// Clave de sesión → plan: «3-2» es la sesión 2 de la semana 3 del programa; «P3-2», la del entrenamiento personal
function planDeClave(key){const C=S.cuenta;key=String(key||'');
 if(key[0]==='P') return C.sbPersonal?{k:'P:'+C.sbPersonal,wn:key.slice(1)}:null;
 const k=progK();return k?{k,wn:key}:null;}
function plantillaDe(key){const x=planDeClave(key);if(!x) return null;const [w,n]=x.wn.split('-').map(Number),P=(CONTENIDO.planes||{})[x.k],id=P&&P[w-1]&&P[w-1][n-1];
 return id?(CONTENIDO.plantillas||[]).find(p=>p.id===id&&p.plan===x.k)||null:null;}
function nombrePlanK(k){if(esPersonalK(k)){const c=esStaff()?clientePlanP(k):null;return c?'Personal · '+conCuenta(c,()=>nombreLocal()):'Entrenamiento personal';}
 const d=destinosPlan().find(x=>x.k===k);return d?d.n:k;}
function destinosTodos(){const L=destinosPlan().filter(d=>puedePlan(d.k)).map(d=>({...d,personal:false}));
 clientes().filter(c=>c.entrenador&&c.sbPersonal&&['activo','pausa','en pausa'].includes(c.estado)).forEach(c=>L.push({k:'P:'+c.sbPersonal,n:'Personal · '+conCuenta(c,()=>nombreLocal()),personal:true,c}));return L;}

// Una vez: los ejercicios y plantillas antiguos pasan a tener identificadores de Supabase, y cada plantilla, a su plan
function migrarPlanes(){const K=CONTENIDO;if(K.migUUID) return;
 K.plantillas=K.plantillas||[];K.planes=K.planes||{};K.publicadas=K.publicadas||{};
 const mapaEj={},medias=[];
 (K.ejercicios||[]).forEach(e=>{if(ES_UUID(e.id)) return;const n=nuevoUUID();mapaEj[e.id]=n;if(e.archivo) medias.push(['ej-'+e.id,'ej-'+n]);e.id=n;});
 const fixEj=x=>{if(x&&x.ejId&&mapaEj[x.ejId]) x.ejId=mapaEj[x.ejId];};
 K.plantillas.forEach(p=>p.bloques.forEach(b=>b.ejercicios.forEach(fixEj)));
 RUT_SES.forEach(([k])=>(K[k]||[]).forEach(b=>(b.ejercicios||[]).forEach(fixEj)));
 const mapaPl={};K.plantillas.forEach(p=>{if(!ES_UUID(p.id)){mapaPl[p.id]=nuevoUUID();p.id=mapaPl[p.id];}});
 Object.values(K.planes).forEach(W=>W.forEach((w,i)=>{if(w) W[i]=w.map(x=>mapaPl[x]||x);}));
 // Cada plantilla se queda en el plan donde está asignada (si está en varios, se copia a cada uno)
 const nueva=[];
 K.plantillas.forEach(p=>{if(p.plan){nueva.push(p);return;}
  const planes=Object.keys(K.planes).filter(k=>K.planes[k].some(w=>(w||[]).includes(p.id)));
  if(!planes.length){nueva.push(p);return;}      // sin usar: queda en «Plantillas sin plan»
  planes.forEach((k,i)=>{const c=i?JSON.parse(JSON.stringify(p)):p;if(i){c.id=nuevoUUID();K.planes[k].forEach((w,j)=>{if(w) K.planes[k][j]=w.map(x=>x===p.id?c.id:x);});}c.plan=k;nueva.push(c);});});
 K.plantillas=nueva;K.migUUID=true;
 try{localStorage.setItem('cv-contenido',JSON.stringify(K));}catch(e){}
 if(medias.length){try{localStorage.removeItem('cv-media-subido');}catch(e){}
  MIG_MEDIA=mediaDB().then(db=>Promise.all(medias.map(([a,b])=>new Promise(ok=>{const t=db.transaction('m','readwrite'),st=t.objectStore('m'),r=st.get(a);
   r.onsuccess=()=>{if(r.result){st.put(r.result,b);st.delete(a);}};t.oncomplete=ok;t.onerror=ok;})))).catch(()=>{});}
}

 if(!pub&&!ses.some(x=>x&&plV.has(x))) return null;   // semana vacía y sin publicar: no hace falta guardarla
 const id=uuidDe('sem|'+k+'|'+w),f={id_semana_plan:id,id_programa:null,id_subplan:null,id_contratacion:null,...duenoPlan(k),semana:w,publicada:pub,fecha_publicacion:pub?P[w]:null,id_publicada_por:pub?uuidAutor(pubPor(k,w)):null};
 const SP=ses.map((pid,i)=>pid&&plV.has(pid)?{id_sesion_plan:uuidDe('ses|'+k+'|'+w+'|'+(i+1)),id_semana_plan:id,num_sesion:i+1,id_plantilla_sesion:pid}:null).filter(Boolean);
 return {id,f,SP,h:hashJ([f,SP])};}

async function planesSubirYa(){if(PLN.en){PLN.pend=true;return;}PLN.en=true;const U=PLN.sub;U.ej=U.ej||{};U.pl=U.pl||{};U.sem=U.sem||{};

   ok(await SB.from('plantilla_sesion').upsert(f));ok(await SB.from('bloque').delete().eq('id_plantilla_sesion',p.id));

   const BE=[];p.bloques.forEach((b,bi)=>b.ejercicios.forEach((x,ei)=>BE.push({id_bloque:B[bi].id_bloque,id_ejercicio:(x.ejId&&ejV.has(x.ejId))?x.ejId:null,ejercicio_nombre:x.nombre||null,series:Math.max(1,+x.series||1),repeticiones:x.reps?String(x.reps):null,tiempo_s:Math.max(0,+x.tiempo||0),descanso_s:Math.max(0,+x.descanso||0),nota:x.nota||null,alternativas:x.alternativas||[],orden:ei+1})));

  const vivasS=new Set();

  const semX=Object.keys(U.sem).filter(i=>!vivasS.has(i));

 PLN.en=false;if(PLN.pend){PLN.pend=false;planesSubir();}}

function cicloDatos(){const Cy=S.cuenta.ciclo,dias=Object.keys(Cy.dias||{}).filter(d=>Cy.dias[d].regla).sort(),per=[];
 dias.forEach(d=>{const l=per[per.length-1];if(l&&diasEntre(l.fin,d)<=2) l.fin=d;else per.push({inicio:d,fin:d});});
 const st=per.map(p=>p.inicio),dif=st.slice(1).map((d,i)=>diasEntre(st[i],d)).filter(x=>x>=18&&x<=45).slice(-6);
 const L=dif.length?Math.round(media(dif)):(+Cy.duracion||28),Pd=per.length?Math.round(media(per.map(p=>diasEntre(p.inicio,p.fin)+1))):(+Cy.regla||5);

function sumarDias(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoDe(d);}

 if(n>D.L){n=((n-1)%D.L)+1;pred=true;}const ov=D.L-14;
 return {n,pred,fase:n<=D.P?'menstrual':n<ov-1?'folicular':n<=ov+1?'ovulatoria':'lutea'};}

function stravaEjemplo(){const A=[],hoy=new Date(hoyISO()+'T00:00:00');let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
 for(let w=5;w>=0;w--) [1,3,5].forEach((dw,i)=>{const d=new Date(hoy);d.setDate(d.getDate()-w*7-((hoy.getDay()+6)%7)+dw);if(d>hoy) return;
  const km=Math.round((i===2?9+rnd()*4:5+rnd()*3)*10)/10,ritmo=Math.round((i===1?290+rnd()*20:320+rnd()*25)),t=Math.round(km*ritmo);
  A.push({fecha:isoDe(d),nombre:i===1?'Series':i===2?'Tirada larga':'Rodaje suave',km,t,ritmo,desn:Math.round(20+rnd()*90)});});
 return A.reverse();}
const hms=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};
const ritmoTxt=r=>`${Math.floor(r/60)}:${String(r%60).padStart(2,'0')} /km`;
function stravaSem(A){const L=lunesDe(hoyISO()),out=[];for(let w=5;w>=0;w--){const a=new Date(L);a.setDate(a.getDate()-7*w);const b=new Date(a);b.setDate(b.getDate()+6);const ia=isoDe(a),ib=isoDe(b);
 out.push([`${a.getDate()}/${a.getMonth()+1}`,Math.round(A.filter(x=>x.fecha>=ia&&x.fecha<=ib).reduce((s2,x)=>s2+x.km,0)*10)/10]);}return out;}

 if(pend&&!c.prog&&!c.solProg&&!c.entrenador){

/* ---------- Calculadora de ritmos (Runners) ---------- */
const DIST=[[5,'5K'],[10,'10K'],[21.0975,'Media maratón'],[42.195,'Maratón']];
function parseTiempo(t){t=String(t||'').trim();if(!t) return null;const p=t.split(':').map(Number);if(p.some(isNaN)) return null;
 if(p.length===3) return p[0]*3600+p[1]*60+p[2];if(p.length===2) return p[0]*60+p[1];return null;}
function fmtT(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
const fmtP=sk=>`${fmtT(sk)} /km`;
function calcRitmos(d,t){
 const pred=k=>t*Math.pow(k/d,1.06);
 const pk=k=>pred(k)/k,p5=pk(5),p10=pk(10),ph=pk(21.0975),pm=pk(42.195);
 return {pred:DIST.map(([k,n])=>({n,t:pred(k),p:pk(k)})),
  zonas:[['Rodaje suave','La mayor parte de tus kilómetros. Puedes hablar.',fmtP(pm+30)+' – '+fmtP(pm+75)],
         ['Ritmo umbral','Esfuerzo «cómodamente duro» que aguantarías unos 50–60 min.',fmtP((p10+ph)/2-5)+' – '+fmtP((p10+ph)/2+5)],
         ['Series cortas','Repeticiones de 400 m a 1 km con recuperación.',fmtP(p5-5)+' – '+fmtP(p5)]]};
}
function calcHTML(){
 const C=S.calc||{};
 let res='';
 if(C.t&&C.d){const R=calcRitmos(C.d,C.t);
  res=`<div class="calc-res"><div><h3>Tiempos estimados</h3><div class="tabla-wrap" style="background:var(--bg)"><table class="tabla" style="min-width:0"><thead><tr><th>Distancia</th><th>Tiempo</th><th>Ritmo</th></tr></thead><tbody>${R.pred.map(x=>`<tr><td>${x.n}</td><td>${fmtT(x.t)}</td><td>${fmtP(x.p)}</td></tr>`).join('')}</tbody></table></div></div>
   <div><h3>Tus ritmos de entrenamiento</h3><div class="zonas">${R.zonas.map(([n,d,r])=>`<div class="zona"><b>${n}</b><span class="zr">${r}</span><p>${d}</p></div>`).join('')}</div></div></div>
   <p class="sec-sub">Estimación con la fórmula de Riegel. Las predicciones de distancias largas desde marcas cortas suelen ser optimistas si aún no tienes volumen de kilómetros.</p>`;}
 return `<section class="acc-card" id="calc"><p class="eyebrow">Herramienta gratis</p><h2>Calculadora de ritmos</h2><p class="sec-sub">Mete una marca reciente y te calculamos tus tiempos estimados y tus ritmos de entrenamiento.</p>
  <div class="dir-form"><div class="field"><label for="c-dist">Distancia</label><select id="c-dist">${DIST.map(([k,n])=>`<option value="${k}" ${C.d==k?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="field"><label for="c-t">Tiempo</label><input type="text" id="c-t" inputmode="numeric" placeholder="Ej.: 27:30 o 1:55:00" value="${esc(C.txt||'')}"></div></div>
  <div class="actions"><button class="btn" id="c-go">Calcular</button></div><p class="pop-err" id="c-err" hidden></p>${res}</section>`;
}

 b.onclick=()=>{const d=+document.getElementById('c-dist').value,txt=document.getElementById('c-t').value,t=parseTiempo(txt);

 if(f.tipo==='check') return h+`<label class="check-row"><input type="checkbox" id="f-${f.id}" data-check="${f.id}" ${r[f.id]?'checked':''}><span>${f.texto}</span></label></div>`;
 if(f.tipo==='numero') return h+`<label for="f-${f.id}">${f.label}</label><div class="num-wrap"><input type="number" id="f-${f.id}" data-num="${f.id}" min="${f.min}" max="${f.max}" inputmode="numeric" placeholder="${esc(f.ph||'')}" value="${esc(r[f.id]||'')}">${f.sufijo?`<span>${f.sufijo}</span>`:''}</div></div>`;
 if(f.tipo==='fecha') return h+`<label for="f-${f.id}">${f.label}</label><input type="date" id="f-${f.id}" data-fecha="${f.id}" ${f.pasada?`max="${hoyISO()}"`:`min="${hoyISO()}"`} value="${esc(r[f.id]||'')}"></div>`;

function evaluarQ(k,r){
 const derivar=[],avisos=[];let nivel=null;
 if(r.lesion==='si') derivar.push('tienes una lesión o molestia');
 if(k==='menopausia'){
  const c=(r.condiciones||[]),sn=(r.sintomas||[]);
  if(c.includes('cardio')) derivar.push('enfermedad cardiaca');
  if(r.hueso==='osteoporosis') derivar.push('osteoporosis');
  if(r.hueso==='osteopenia') avisos.push('Con osteopenia, la fuerza y los impactos progresivos ayudan a cuidar el hueso: empezaremos poco a poco.');
  if(r.hueso==='no') avisos.push('Pregunta a tu médica o médico si te conviene hacerte una densitometría.');
  if(sn.includes('orina')||sn.includes('bulto')) avisos.push('Te recomendamos una revisión del suelo pélvico con fisioterapia.');
  if(sn.includes('sofocos')) avisos.push('Si tienes sofocos, entrena en horas frescas, con ropa transpirable y bien hidratada.');
  if(c.includes('hipertension')||c.includes('diabetes')) avisos.push('Comenta con tu médica o médico que vas a empezar a entrenar.');
 } else {
  nivel=r.exp==='3'?'Avanzado':r.exp==='2'?'Intermedio':'Principiante';
  if(nivel!=='Principiante'&&(r.tecnica||[]).includes('ninguno')){nivel='Principiante';avisos.push('Empezarás por el nivel principiante para afianzar la técnica de los ejercicios básicos.');}

 }
 return {derivar,avisos,nivel};
}
