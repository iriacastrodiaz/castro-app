# Evita que el proyecto gratuito de Supabase se pause por inactividad (se pausa tras 7 días sin uso).
# Cada 3 días hace una consulta pequeña de solo lectura a la tabla de programas.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 6 */3 * *"   # cada 3 días a las 06:17 UTC
  workflow_dispatch: {}       # también se puede lanzar a mano desde la pestaña Actions

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          # Clave pública (anon): es la misma que ya está en la web, no da acceso a datos privados
          SB_URL: https://rpdaorrcdbsgftpfplis.supabase.co
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwZGFvcnJjZGJzZ2Z0cGZwbGlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NzgzNzcsImV4cCI6MjEwOTQ1NDM3N30.WjbdzHvz0YK7Ecvf3bTWIp9CW5-G8uIeeXd3GlgWMXg
        run: |
          code=$(curl -s -o respuesta.json -w "%{http_code}" "$SB_URL/rest/v1/programa?select=id_programa&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Respuesta de Supabase: $code"; cat respuesta.json; echo
          test "$code" = "200"
